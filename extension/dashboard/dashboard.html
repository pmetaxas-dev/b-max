<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B-MAX</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="../shared/max/max.css" />
    <style>
      /* One calm page, no scrolling. The planet is the backdrop; on the left
         one column holds Max, the one task to do NOW, the rest of today, and
         a chat that opens only when you ask for it. Big targets, few words,
         one point of focus at a time. */
      :root {
        color-scheme: dark;
        --bg: #050b14;
        --fg: #f1f5f2;
        --muted: #a9b8c6;
        --accent: #f2c46d;
        --accent-fg: #201505;
        --accent-soft: rgba(242, 196, 109, 0.14);
        --good: #7bd88f;
        --border: #8593a1;
        --focus: #fbbf24;
        --surface: rgba(13, 23, 37, 0.8);
        --edge: rgba(255, 255, 255, 0.12);
        --radius: 22px;
        --column: min(500px, 46vw);
      }
      html, body { height: 100%; overflow: hidden; }
      body { padding: 0; font-size: 17px; line-height: 1.45; }
      main { height: 100vh; }
      button { border-radius: 14px; font-weight: 600; }

      #planet-slot .planet { position: fixed; inset: 0 0 0 calc(var(--column) - 60px); margin: 0; z-index: 0; }
      #planet-slot .planet-frame { width: 100%; height: 100%; max-width: none; aspect-ratio: auto; margin: 0; border: 0; border-radius: 0; }
      #planet-slot figcaption {
        position: fixed; right: 20px; bottom: 16px; z-index: 3; pointer-events: none;
        padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--edge); font-size: 0.9rem;
      }
      main::before {
        content: ''; position: fixed; inset: 0 auto 0 0; width: var(--column); z-index: 1; pointer-events: none;
        background: linear-gradient(to right, var(--bg) calc(100% - 60px), transparent);
      }

      #app { position: relative; z-index: 2; width: var(--column); height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 14px 22px 22px; }

      /* Max: his lamp and his name, always in the same place. */
      .top { display: flex; align-items: center; gap: 14px; flex: none; }
      .max-stage { position: relative; z-index: 7; flex: none; width: 68px; height: 68px; --max-size: 68px; transition: height 0.4s ease; }
      .max-stage .max-anchor { --max-x: 50%; --max-y: 50%; --max-size: inherit; }
      .max-stage .max { cursor: default; }
      .who { min-width: 0; position: relative; z-index: 2; }
      .who h1 { margin: 0; font-size: 1.7rem; line-height: 1.1; letter-spacing: -0.01em; }
      .who .role { display: block; margin-top: 2px; font-size: 0.9rem; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
      #motivation { margin: 4px 0 0; color: var(--fg); font-size: 0.92rem; opacity: 0.9; }
      #motivation:empty { display: none; }
      body.onboarding .top { flex-direction: column; text-align: center; gap: 4px; }
      body.onboarding .max-stage { --max-size: 150px; width: 150px; height: 262px; margin: 2px 0 10px; }
      body.onboarding .who { order: -1; } /* the name above his head: the shoes stay in view */
      body.onboarding #motivation { display: none; }
      /* His name on a small plate, once he stands up in full. */
      body.onboarding .who .role { color: var(--accent-fg); opacity: 0.8; }
      body.onboarding .who h1 { display: inline-block; padding: 2px 16px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 1.3rem; }

      /* A message from Max while the chat is closed. */
      .say { flex: none; display: block; width: 100%; text-align: left; padding: 12px 16px; border-radius: 18px; font-weight: 500;
             color: var(--fg); background: var(--accent-soft); border: 1px solid rgba(242, 196, 109, 0.35); }
      .say[hidden] { display: none; }

      .row-chips { display: flex; flex-wrap: wrap; gap: 8px; flex: none; }
      .pill { min-height: 38px; padding: 4px 14px; font-size: 0.92rem; font-weight: 600; color: var(--fg); background: var(--surface); border: 1px solid var(--edge); border-radius: 999px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      body.onboarding .row-chips { display: none; }

      /* The one thing to do now. */
      .now { flex: none; padding: 18px 20px 20px; border-radius: 26px; background: var(--surface); border: 1px solid rgba(242, 196, 109, 0.4); backdrop-filter: blur(12px); }
      .now-label { margin: 0; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.16em; color: var(--accent); }
      .now-title { margin: 6px 0 4px; font-size: 1.5rem; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
      .now-meta { margin: 0; color: var(--muted); font-size: 0.95rem; }
      .now-note { margin: 8px 0 0; font-size: 0.95rem; color: var(--fg); }
      .meter { height: 8px; margin-top: 12px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
      .now-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      .now-actions button { min-height: 50px; padding: 8px 20px; font-size: 1.05rem; }
      .now-actions .quiet { color: var(--fg); background: transparent; border-color: var(--border); }
      .empty { margin: 4px 0 0; color: var(--muted); }
      body.onboarding .now, body.onboarding .later { display: none; }

      .later { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
      .later h2 { margin: 2px 0 6px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
      .task-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; }
      .task { display: flex; align-items: center; gap: 12px; padding: 8px 4px; margin: 0; font-weight: 500; }
      .task input[type="checkbox"] { width: 24px; height: 24px; flex: none; accent-color: var(--accent); }
      .task .t-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .task .t-meta { flex: none; color: var(--muted); font-size: 0.88rem; white-space: nowrap; }
      .task .chip-q { color: var(--accent-fg); background: var(--accent); border-radius: 999px; padding: 1px 9px; font-weight: 700; }
      .task.done .t-text { text-decoration: line-through; color: var(--muted); }
      .task.done .t-meta { color: var(--good); }
      .spacer { flex: 1; }

      /* Ticking a task is a serious thing: it asks first, and can be undone. */
      .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; padding: 10px 12px; border-radius: 16px; background: var(--accent-soft); border: 1px solid rgba(242, 196, 109, 0.4); }
      .confirm p { margin: 0 4px 0 0; font-weight: 600; flex: 1 1 100%; }
      .confirm button { min-height: 44px; }
      .task .undo { flex: none; min-height: 34px; padding: 2px 10px; font-size: 0.85rem; }

      /* On hello he grows a little, so the wave can be seen. */
      .max-stage.hello { transform: translate(64px, 8px) scale(1.7); transform-origin: 0 0; }

      /* Max is alive: he moves next to the chat while you talk, blinks while he
         thinks, and waves hello. */
      /* While the chat is open a second Max peeks out from behind its right side
         and stays there; he goes away with the chat. The lamp on top never moves. */
      .max-peek { position: fixed; z-index: 4; left: calc(var(--column) - 52px); bottom: 34px; width: 100px; height: 176px; --max-size: 100px;
                  opacity: 0; visibility: hidden; transform: translateX(-96px) rotate(4deg); transform-origin: 0 100%;
                  transition: transform 0.55s cubic-bezier(0.3, 0.55, 0.25, 1), opacity 0.3s ease, visibility 0s linear 0.55s; }
      .max-peek.open { opacity: 1; visibility: visible; transform: rotate(4deg); transition-delay: 0.15s, 0.15s, 0s; }
      .max-peek .max-anchor { --max-x: 50%; --max-y: 52px; --max-size: inherit; }
      .max-peek .max { cursor: default; }
      body.onboarding .max-peek { display: none; }
      button.mic[aria-pressed="true"] { box-shadow: 0 0 0 calc(var(--level, 0) * 14px) rgba(242, 196, 109, 0.4); }
      /* The language of the app, like on a website. */
      .lang { display: inline-flex; border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; background: var(--surface); }
      .lang button { min-width: 44px; min-height: 44px; padding: 4px 10px; border: 0; border-radius: 0; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); background: transparent; }
      .lang button[aria-pressed="true"] { color: var(--accent-fg); background: var(--accent); outline: none; }
      @media (prefers-reduced-motion: no-preference) {
        .max-anchor.thinking .max #max-eyes { animation: max-blink 1.1s ease-in-out infinite; }
        .max-anchor.waving .max-body #maxb-arms > g[transform] > .maxb-arm,
        .max-anchor.waving .max-body #maxb-gloves > g[transform] > .maxb-glove { animation: max-wave 2.6s ease-in-out 1; }
      }
      /* The right arm (a mirrored copy) swings up and waves, around the shoulder. */
      @keyframes max-wave {
        0%, 100% { transform: rotate(0deg); }
        18% { transform: rotate(150deg); }
        32% { transform: rotate(128deg); }
        46% { transform: rotate(160deg); }
        60% { transform: rotate(128deg); }
        74% { transform: rotate(160deg); }
        88% { transform: rotate(140deg); }
      }
      body.onboarding .spacer { display: none; }

      /* The chat: a drawer that opens on request (or is the whole page while
         getting to know each other). */
      .fab { position: fixed; left: 22px; bottom: 22px; z-index: 4; min-height: 54px; padding: 8px 22px; font-size: 1.05rem; color: var(--accent-fg); background: var(--accent); border: none; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45); border-radius: 999px; }
      .fab .dot { display: inline-block; width: 10px; height: 10px; margin-left: 8px; border-radius: 50%; background: #ef4444; vertical-align: middle; }
      .fab .dot[hidden] { display: none; }
      body.onboarding .fab { display: none; }
      .drawer {
        position: fixed; left: 22px; bottom: 22px; z-index: 5; width: calc(var(--column) - 44px); height: min(780px, calc(100vh - 112px));
        display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; border-radius: 26px;
        background: rgba(10, 18, 30, 0.96); border: 1px solid var(--edge); box-shadow: 0 16px 60px rgba(0, 0, 0, 0.6);
        opacity: 0; visibility: hidden; transform: translateY(18px); transition: opacity 0.22s ease, transform 0.22s ease, visibility 0s linear 0.22s;
      }
      .drawer.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
      .drawer-head { display: flex; align-items: center; justify-content: space-between; margin: 0; font-weight: 700; }
      .drawer-head button { min-height: 40px; min-width: 40px; padding: 4px 10px; }
      body.onboarding .drawer { position: static; opacity: 1; visibility: visible; transform: none; flex: 1; width: auto; height: auto; min-height: 0; box-shadow: none; background: var(--surface); }
      body.onboarding .drawer-head { display: none; }

      .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
      .chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
      .msg { margin: 0; padding: 10px 14px; border-radius: 16px; max-width: 92%; overflow-wrap: anywhere; white-space: pre-wrap; }
      .msg-max { align-self: flex-start; background: var(--accent-soft); border: 1px solid rgba(242, 196, 109, 0.32); }
      .msg-user { align-self: flex-end; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--edge); }
      .chat-compose { position: relative; flex: none; }
      .chat-form { display: flex; gap: 10px; align-items: flex-end; }
      .chat-form textarea { flex: 1; min-width: 0; height: 132px; padding: 12px 14px; resize: none; overflow-y: auto; font: inherit; line-height: 1.45; color: var(--fg); background: rgba(0, 0, 0, 0.4); border: 2px solid var(--border); border-radius: 16px; }
      .chat-actions { display: flex; flex-direction: column; gap: 8px; }
      .chat-actions button { min-width: 92px; }
      /* Suggestions: a small menu floating over the conversation, never beside it. */
      .suggest-menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 3; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 18px; background: rgba(20, 32, 48, 0.98); border: 1px solid var(--edge); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
      .suggest-menu[hidden] { display: none; }
      .suggest-menu button { text-align: left; min-height: 44px; font-weight: 600; }
      .chat-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .chat-tools .small { min-height: 34px; padding: 4px 10px; font-size: 0.85rem; }
      /* One line, always: a long status must never push the rest of the chat around. */
      .chat-status { margin: 0; color: var(--muted); font-size: 0.85rem; flex: 1; min-height: 1.3em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chat-tools { min-height: 38px; flex-wrap: nowrap; }
      button.mic[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

      .unavailable { padding: 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--edge); }

      /* For everyone: a skip link, larger text, and strong contrast. */
      .skip { position: absolute; left: -9999px; top: 8px; z-index: 30; padding: 10px 16px; border-radius: 12px; font-weight: 700; color: var(--accent-fg); background: var(--accent); }
      .skip:focus { left: 12px; }
      html.large-text body { font-size: 22px; }
      html.large-text .now-title { font-size: 1.8rem; }
      html.high-contrast { --bg: #000; --fg: #fff; --muted: #f2f2f2; --accent: #ffe066; --accent-fg: #000; --accent-soft: #1c1a00; --surface: #000; --edge: #fff; --border: #fff; }
      html.high-contrast .now, html.high-contrast .drawer, html.high-contrast .popover, html.high-contrast .msg, html.high-contrast .pill { border: 2px solid #fff; background: #000; }
      html.high-contrast main::before { background: #000; }
      .a11y-status { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--edge); }
      .a11y-keys { margin: 4px 0 0; padding-left: 20px; }
      .a11y-keys kbd { padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); font: inherit; font-weight: 700; }

      /* Small tools, top right. */
      .tools { position: fixed; top: 12px; right: 12px; z-index: 6; display: flex; align-items: center; gap: 8px; }
      .brand { font-weight: 800; letter-spacing: 0.12em; font-size: 0.85rem; color: var(--muted); padding-right: 6px; }
      .tools button { min-width: 44px; min-height: 44px; padding: 6px 10px; font-size: 1.15rem; color: var(--fg); background: var(--surface); border: 1px solid var(--edge); }
      .popover { position: fixed; top: 66px; right: 12px; z-index: 6; width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 90px); overflow-y: auto; padding: 6px 18px 16px; border-radius: 20px; background: rgba(10, 18, 30, 0.97); border: 1px solid var(--edge); backdrop-filter: blur(12px); }
      .popover[hidden] { display: none; }
      .popover h2 { font-size: 1.05rem; margin: 14px 0 8px; }
      .popover ul { padding-left: 20px; }
      .popover .choices { display: flex; flex-wrap: wrap; gap: 8px; }
      .popover .choices button { min-height: 42px; }
      .popover input[type="range"] { width: 100%; accent-color: var(--accent); }
      #goal-pop, #chest-pop { left: 22px; right: auto; top: auto; bottom: auto; }
      /* The idea chest: one box to throw thoughts in, and what is inside. */
      #chest-input { width: 100%; min-height: 72px; padding: 10px 12px; resize: none; font: inherit; color: var(--fg); background: rgba(0, 0, 0, 0.4); border: 2px solid var(--border); border-radius: 14px; }
      .chest-list { list-style: none; margin: 10px 0 0; padding: 0; }
      .chest-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--edge); }
      .chest-item span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .chest-item button { min-height: 38px; padding: 2px 10px; font-size: 0.85rem; }
      .pill .badge { margin-left: 6px; padding: 0 7px; border-radius: 999px; font-weight: 800; color: var(--accent-fg); background: var(--accent); }
      #dev-panel .row { flex-direction: column; gap: 8px; }
      #dev-panel .dev-fast { font-weight: 400; display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; }
      #dev-panel .dev-fast input { width: 20px; height: 20px; flex: none; margin-top: 3px; }

      /* Narrow windows: the planet steps aside, the column takes the page. */
      @media (max-width: 860px) {
        :root { --column: 100%; }
        #planet-slot .planet, #planet-slot figcaption, main::before { display: none; }
        .drawer { width: calc(100vw - 44px); }
      }
      @media (max-height: 640px) {
        .now-title { font-size: 1.25rem; }
        .max-stage { width: 64px; height: 64px; --max-size: 64px; }
      }
    </style>
  </head>
  <body class="onboarding">
    <a class="skip" href="#now-card">Skip to your task · Πήγαινε στο task σου</a>
    <main>
      <!-- The planet lives outside #app so re-rendering does not reload the
           scene; it reloads only when the era changes. -->
      <section id="planet-slot" class="planet-slot" aria-label="Planet"></section>
      <div id="app"></div>
    </main>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="el" aria-pressed="false" lang="el" aria-label="Ελληνικά">EL</button>
        <button type="button" data-lang="en" aria-pressed="false" lang="en" aria-label="English">EN</button>
      </div>
      <span class="brand" aria-hidden="true">B-MAX</span>
      <button id="a11y-btn" type="button" aria-label="Accessibility" aria-expanded="false" aria-controls="a11y-pop">♿</button>
      <button id="sound-btn" type="button" aria-label="Focus sound" aria-expanded="false" aria-controls="sound-pop">🎧</button>
      <button id="dev-gear" type="button" aria-label="Test tools" aria-expanded="false" aria-controls="dev-panel">⚙️</button>
    </div>
    <section id="a11y-pop" class="popover" aria-label="Accessibility" hidden></section>
    <section id="sound-pop" class="popover" aria-label="Focus sound" hidden></section>
    <section id="goal-pop" class="popover" aria-label="My goal" hidden></section>
    <section id="chest-pop" class="popover" aria-label="Idea chest" hidden></section>
    <section id="dev-panel" class="popover" aria-label="Test tools" hidden></section>
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <script src="../shared/max/max.js"></script>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
